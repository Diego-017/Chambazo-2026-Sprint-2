<div class="app-shell">

    <span class="sidebar-brand-text">Chambazo Admin</span>
  </div>
  <nav class="sidebar-nav">
    <a href="{% url 'panel_admin' %}" class="sidebar-link {% if active == 'dashboard' %}active{% endif %}">

    </a>
    <a href="{% url 'admin_usuarios' %}" class="sidebar-link {% if active == 'usuarios' %}active{% endif %}">
      <i class="bi bi-people-fill"></i><span class="link-text">Usuarios</span>

</aside>

    <div class="brand-icon" style="background:var(--navy-3);"><i class="bi bi-shield-lock-fill"></i></div>
