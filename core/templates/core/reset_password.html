{% extends 'core/base.html' %}
{% block title %}Nueva Contraseña – Chambazo{% endblock %}
{% block body %}
<div class="auth-bg">
  <div class="auth-card">
    <div class="logo-circle"><i class="bi bi-shield-lock-fill"></i></div>
    <h1 class="auth-title">Nueva contraseña</h1>
    <p class="auth-sub">Ingresa tu nueva contraseña segura</p>
    {% if messages %}{% for m in messages %}<div class="alert alert-danger mt-3 py-2 small">{{ m }}</div>{% endfor %}{% endif %}
    <form method="post" class="mt-4">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold small">Nueva contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold small">Confirmar contraseña</label>
        <input type="password" name="password2" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-ch-green w-100 fw-bold">Guardar contraseña</button>
    </form>
  </div>
</div>
{% endblock %}
