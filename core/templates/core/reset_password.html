{% extends 'core/base.html' %}
{% block title %}Nueva contraseña{% endblock %}
{% block body %}
<div class="auth-shell">
  <aside class="auth-side">
    <div class="auth-side-logo"><div class="brand-icon"><i class="bi bi-briefcase-fill"></i></div><span>Chambazo</span></div>
    <h1>Casi listo</h1><p class="lead">Define tu nueva contraseña para continuar.</p>
  </aside>
  <main class="auth-main">
    <div class="auth-form-wrap">
      <h2>Nueva contraseña</h2>
      <form method="post">
        {% csrf_token %}<input type="hidden" name="token" value="{{ token }}">
        <div class="form-group"><label class="form-label">Nueva contraseña</label><input type="password" name="password" class="form-control" minlength="6" placeholder="Mínimo 6 caracteres" required></div>
        <button type="submit" class="btn btn-g btn-full btn-lg">Actualizar contraseña</button>
      </form>
    </div>
  </main>
</div>
{% endblock %}
