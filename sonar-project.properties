# ==============================================================================
# SonarQube Project Configuration — Chambazo (Sprint 3 / Semana 11 & 12)
# ==============================================================================
sonar.projectKey=chambazo
sonar.projectName=Chambazo 2026 Sprint 3
sonar.projectVersion=3.0
sonar.sourceEncoding=UTF-8

# Source and Test paths
sonar.sources=core,chambazo
sonar.tests=core/tests.py
sonar.python.version=3.12

# Coverage and exclusions
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=**/migrations/**,**/static/**,**/media/**
sonar.coverage.exclusions=**/migrations/**,**/tests.py
